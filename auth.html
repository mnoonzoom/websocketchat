<!DOCTYPE html>
<html>

<head>
    <title>Online Chat</title>
</head>

<body id="body" class="bg-light text-dark">
<nav id="navbar" class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <span class="navbar-brand">Chat App</span>
    </div>
    <button id="themes">button</button>
</nav>
        <div class="container login-container" >
            <div class="row">
                <div id="login form" class="col-md-12 login-form">
                    <h3>Login/Register</h3>
                    <form>
                        <div class="form-group">
                            <input id="username" placeholder="Username">
                        </div>
                        <div class="form-group">
                            <input type="password" id="password" placeholder="Password">
                        </div>
                        <div class="form-group">
                            <input type="button" class="btnSubmit" id="login" value="Login" />
                        </div>
                        <div class="form-group">
                            <input type="button" class="btnSubmit" id="register" value="Register" />
                        </div>
                    </form>
                </div>
            </div>
        </div>





    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="/static/auth.js"></script>
    <script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.esm.min.js"></script>
</body>

</html>
